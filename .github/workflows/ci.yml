name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hht, POSTGRES_PASSWORD: hht, POSTGRES_DB: hht_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hht -d hht_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hht:hht@localhost:5432/hht_test
      TZ: UTC   # cố ý chạy UTC để bắt lỗi giờ nghiệp vụ không dùng Intl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t hht-tuyen-sinh-ai .
