<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tư vấn tuyển sinh HHT</title>
  <meta name="theme-color" content="#c8102e">
  <link rel="icon" href="/img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="stylesheet" href="/css/app.css?v=20261117d">
</head>
<body data-no-chat>
  <div class="chat-app">
    <header class="chat-top">
      <img class="chat-logo" src="/img/logo-hht-full.png" alt="HHT – Trường Cao đẳng Công nghệ cao Hà Nội" width="432" height="64">
      <strong id="chat-title" class="chat-title">Tư vấn tuyển sinh</strong>
      <button class="chat-close" type="button" data-action="close" id="close-btn" aria-label="Đóng khung tư vấn" title="Đóng">&times;</button>
    </header>
    <div class="chat-log" id="log" role="log" aria-live="polite"></div>
    <div>
      <div class="chat-handoff hidden" id="handoff"></div>
      <form class="chat-input" data-action="send">
        <label class="visually-hidden" for="msg">Câu hỏi</label>
        <input id="msg" name="message" maxlength="1000" autocomplete="off" placeholder="Nhập câu hỏi về tuyển sinh…">
        <button class="btn btn--primary" type="submit">Gửi</button>
      </form>
    </div>
  </div>
  <script src="/js/apiClient.js?v=20261117d"></script>
  <script src="/js/actionDelegate.js?v=20261117d"></script>
  <script src="/js/common.js?v=20261117d"></script>
  <script src="/js/pages/chat.js?v=20261117d"></script>
</body>
</html>
