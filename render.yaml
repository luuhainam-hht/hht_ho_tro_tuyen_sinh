# Phương án thay thế: Render + Neon. Nhập DATABASE_URL, khóa bí mật thủ công trong Dashboard.
services:
  - type: web
    name: hht-tuyen-sinh-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VISITOR_HASH_SECRET
        generateValue: true
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
